[paths]
game_files="./gamedata/"
support_files="./gamedata/"
android_package_code="./"
# The game's unedited APK (relative to game_files). Unity reads its data from it; native libraries are extracted on first run.
apk="./base.apk"
android_external_files="../conf/"
android_files="../conf/"
android_cache="../cache/"
android_obb_dirs=["./gamedata/"]
android_source_dirs=["./gamedata/"]

[package]
packageName="com.GeoffWoollams.UnityProbe"
versionName="0.1.0"
mainIntentBundle = { unity = "" }

[device]
displayWidth=640
displayHeight=480
displayRotation=0
splash = "splash.bmp"

[input]
controller=true
